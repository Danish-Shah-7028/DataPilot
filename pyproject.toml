[project]
name = "datapilot"
version = "0.1.0"
description = "A self-correcting, multi-agent data analyst built with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "faiss-cpu>=1.8",
    "httpx>=0.27",
    "joblib>=1.4",
    "langgraph>=0.2.60",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "openai>=1.50",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.1",
    "streamlit>=1.39",
    "torch>=2.4",
]

[project.scripts]
datapilot-ping = "datapilot.llm.provider:main"
datapilot-samples = "datapilot.data.samples:main"
datapilot-ask = "datapilot.cli:main"
datapilot-prepare-benchmark = "datapilot.eval.prepare_benchmark:main"
datapilot-eval = "datapilot.eval.run_eval:main"
datapilot-summarise = "datapilot.eval.summarise_results:main"
datapilot-ml-eval = "datapilot.eval.ml_eval:main"
datapilot-train-confidence = "datapilot.ml.confidence_model:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# The package has no __init__.py files on purpose (implicit namespace packages),
# so hatch is told explicitly where the code lives.
[tool.hatch.build.targets.wheel]
packages = ["src/datapilot"]

# CPU-only torch keeps CI and the Docker image small; the CUDA build is ~2 GB.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "PT", "RUF"]
ignore = ["PT018"]
# The project bans leading underscores, so intentionally unused names start with "unused".
dummy-variable-rgx = "^unused(_[a-z0-9_]*)?$"

[tool.ruff.lint.isort]
known-first-party = ["datapilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
filterwarnings = ["ignore::DeprecationWarning"]
